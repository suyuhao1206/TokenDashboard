<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Token Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<script>
/* 主题要在样式表之前定，避免闪一帧深色 */
try {
  var saved = localStorage.getItem("td-theme");
  document.documentElement.dataset.theme = (saved === "light" || saved === "dark")
    ? saved : "dark";   /* 浮窗默认深色：桌面角落一块深色更不抢眼 */
} catch (e) {}
</script>
<link rel="stylesheet" href="/static/shared.css">
<style>
  /* 浮窗专属：整页就是一张卡，不要滚动条 */
  html, body { height: 100%; overflow: hidden; }
  body { border-radius: var(--radius); }
  .sheet {
    height: 100%; display: flex; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0;
    user-select: none;
  }

  /* 标题栏：拖动区 */
  .titlebar {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px 6px;
    cursor: grab;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface2), transparent);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .titlebar:active { cursor: grabbing; }
  .titlebar .logo { color: var(--accent); font-size: 13px; line-height: 1; }
  .titlebar .name { font-size: 11.5px; font-weight: 600; letter-spacing: .2px; }
  .titlebar .clock { margin-left: auto; font-size: 10.5px; color: var(--faint);
                     font-variant-numeric: tabular-nums; }
  .titlebar button {
    padding: 1px 6px; font-size: 11px; line-height: 1.5;
    background: transparent; border-color: transparent; color: var(--muted);
  }
  .titlebar button:hover { color: var(--text); background: var(--surface2); border-color: var(--border); }
  .titlebar .iconbtn { font-size: 12px; }

  /* U6：月度预算进度微条（<80% 绿 / 80-100% 黄 / ≥100% 红），悬停显示已用金额。
     未设置预算时整条隐藏，不占高度。 */
  .budget-bar { height: 2px; background: var(--border); overflow: hidden; flex: none; }
  .budget-bar[hidden] { display: none; }
  .budget-bar i { display: block; height: 100%; width: 0%; background: var(--green);
                  transition: width .3s; }
  .budget-bar.warn i { background: var(--amber); }
  .budget-bar.err i { background: var(--red); }

  .body { padding: 7px 12px 9px; flex: 1; display: flex; flex-direction: column;
          gap: 5px; min-height: 0; }

  .row-today { display: flex; align-items: center; gap: 8px; line-height: 1.1; }
  .row-today .v {
    font-size: 27px; font-weight: 700; letter-spacing: -.8px;
    background: linear-gradient(135deg, var(--text) 30%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .row-today .cost {
    margin-left: auto; padding: 2px 7px; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, var(--surface2));
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .row-today .cost.none { color: var(--faint); background: var(--surface2); border-color: var(--border); font-weight: 400; }
  .label { font-size: 10.5px; color: var(--faint); line-height: 1.2; }

  .row-sub { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub b { color: var(--text); font-weight: 600; }

  /* 7 日迷你柱：纯 flex + 高度百分比，不引入图表库。
     flex:1 吃掉剩余高度——浮窗被拉高时柱子跟着变高，而不是留一块空白。
     今日柱渐变 + 微光，与灰调历史柱拉开层次。 */
  .spark { display: flex; align-items: flex-end; gap: 4px; height: 30px; margin-top: 1px;
           flex: 1 1 auto; min-height: 24px; max-height: 60px; }
  .spark .bar {
    flex: 1; min-height: 3px; border-radius: 3px 3px 1px 1px;
    background: color-mix(in srgb, var(--accent) 38%, var(--surface2));
    transition: height .3s ease, background .15s;
    cursor: pointer;
  }
  .spark .bar.last {
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 65%, transparent));
    box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .spark .bar:hover { background: var(--accent); }
  /* A5：空柱子仍然可点击（打开面板看那天为什么空），所以指针必须是 pointer，
     提示文案也写「点击查看」——样式、文案、行为三者一致。 */
  .spark .bar.void {
    background: color-mix(in srgb, var(--border-strong) 55%, transparent);
    cursor: pointer;
  }
  .spark .bar.void:hover { background: var(--accent); opacity: .7; }

  /* 多色 Harness 占比条：与下方图例同色（colorFor），一屏回答「用量都是谁产生的」 */
  .hbar { display: flex; height: 4px; gap: 2px; border-radius: 99px; overflow: hidden;
          background: var(--surface2); flex: none; }
  .hbar i { display: block; height: 100%; border-radius: 99px; }

  .row-harness { display: flex; gap: 8px; font-size: 10px; color: var(--muted);
                 font-variant-numeric: tabular-nums; white-space: nowrap;
                 overflow: hidden; }
  .row-harness span { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .row-harness i { width: 6px; height: 6px; border-radius: 50%; display: block; flex: none; }

  .foot { display: flex; align-items: center; gap: 5px;
          font-size: 10px; color: var(--faint); min-width: 0; }
  /* 「12,412 条未定价」这种长文本会把「面板 ↗」挤出去：状态文字自己截断，
     按钮永不收缩（flex: none）。 */
  .foot #status { flex: 0 1 auto; min-width: 0; overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
  .foot .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex: none; }
  .foot .dot.warn { background: var(--amber); }
  .foot .dot.err { background: var(--red); }
  .foot .spacer { flex: 1 1 2px; min-width: 2px; }
  .foot button { padding: 0 5px; font-size: 10px; background: transparent;
                 border-color: transparent; color: var(--faint);
                 flex: none; white-space: nowrap; }
  .foot button:hover { color: var(--text); }

  /* 右键菜单 */
  .menu {
    position: fixed; z-index: 90; min-width: 132px;
    padding: 4px; background: var(--surface2);
    border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: var(--shadow-pop);
    display: none;
  }
  .menu.show { display: block; }
  .menu button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 5px 9px; font-size: 11.5px; text-align: left;
    background: transparent; border: 0; border-radius: 6px; color: var(--text);
  }
  .menu button:hover { background: var(--accent); color: var(--on-accent); }
  .menu .sep { height: 1px; margin: 3px 4px; background: var(--border); }

  /* 提示条：Esc 二次确认 / 置顶 / 自启切换都需要它（shared.js 的 toast() 依赖 #toast） */
  #toast { position: fixed; left: 50%; bottom: 10px; z-index: 95;
           max-width: calc(100% - 20px); padding: 5px 10px; font-size: 11px;
           color: var(--text); background: var(--surface2);
           border: 1px solid var(--border-strong); border-radius: 7px;
           box-shadow: var(--shadow-pop); text-align: center;
           opacity: 0; pointer-events: none; transform: translate(-50%, 8px);
           transition: opacity .15s, transform .15s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="sheet">
  <div class="titlebar" id="titlebar" title="拖动移动 · 双击打开面板">
    <span class="logo">⚡</span>
    <span class="name">Token</span>
    <span class="clock" id="clock">--:--</span>
    <button class="iconbtn" id="btnRefresh" title="刷新">↻</button>
    <button class="iconbtn" id="btnClose" title="退出">✕</button>
  </div>

  <div class="budget-bar" id="budgetBar" hidden title=""><i id="budgetFill"></i></div>

  <div class="body">
    <div class="label">今日</div>
    <div class="row-today">
      <span class="v" id="todayTokens">–</span>
      <span class="cost" id="todayCost">–</span>
    </div>

    <div class="row-sub">
      近 7 天 <b id="d7Tokens">–</b> · <b id="d7Cost">–</b>
    </div>

    <div class="spark" id="spark" title="近 7 天用量"></div>

    <div class="hbar" id="hbar"></div>

    <div class="row-harness" id="harness"></div>

    <div class="foot">
      <span class="dot" id="dot"></span>
      <span id="status">连接中…</span>
      <span class="spacer"></span>
      <button id="btnPanel" title="在浏览器中打开完整面板">面板 ↗</button>
    </div>
  </div>
</div>

<div class="menu" id="menu">
  <button data-act="refresh">↻ 刷新</button>
  <button data-act="panel">↗ 打开面板</button>
  <button data-act="theme">◐ 切换主题</button>
  <button data-act="top">⇧ 置顶</button>
  <button data-act="autostart">⇧ 开机自启</button>
  <div class="sep"></div>
  <button data-act="quit">✕ 退出</button>
</div>
<div id="toast"></div>

<script src="/static/shared.js"></script>
<script>
const POLL_MS = 30000;
const state = { data: null, timer: null, top: true, autostart: false };

/* ---------- 渲染 ---------- */
function renderSpark(daily) {
  const el = document.getElementById("spark");
  // 近 7 天（含今天），缺的天补 0
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(daysAgo(i));
  const map = {};
  (daily || []).forEach(r => { map[r.date] = r.tokens || 0; });
  const vals = days.map(d => map[d] || 0);
  const max = Math.max(...vals, 1);
  // C8：柱子带 data-date，点击跳到面板并筛选到那一天。
  // A5：空柱子同样可点（进面板能看到那天确实没用量），title 文案也相应区分。
  el.innerHTML = vals.map((v, i) => {
    const pct = Math.max(3, Math.round(v / max * 100));
    const cls = "bar" + (i === vals.length - 1 ? " last" : "") + (v ? "" : " void");
    const tip = v
      ? `${days[i]} · ${compact(v)}（点击打开面板）`
      : `${days[i]} · 当天无用量（点击查看）`;
    return `<div class="${cls}" data-date="${esc(days[i])}" style="height:${pct}%"
      title="${esc(tip)}"></div>`;
  }).join("");
}

function render(summary, daily, meta) {
  const all = summary.all || {}, today = summary.today || {}, d7 = summary.last7d || {};
  const tk = o => (o && o.events) ? (o.tokens || 0) : 0;

  document.getElementById("todayTokens").textContent = compact(tk(today));
  const costEl = document.getElementById("todayCost");
  if (isNum(today.cost)) {
    costEl.textContent = money(today.cost);
    costEl.classList.remove("none");
  } else {
    costEl.textContent = tk(today) ? "未定价" : "—";
    costEl.classList.add("none");
  }

  document.getElementById("d7Tokens").textContent = compact(tk(d7));
  const d7CostEl = document.getElementById("d7Cost");
  d7CostEl.textContent = isNum(d7.cost) ? money(d7.cost) : (tk(d7) ? "未定价" : "—");

  renderSpark(daily);

  // 多色占比条（Top 4 harness）+ 图例（Top 2）：颜色与面板一致（colorFor）
  const hsAll = summary.by_harness || [];
  const hsTot = hsAll.reduce((s, h) => s + (h.tokens || 0), 0) || 1;
  document.getElementById("hbar").innerHTML = hsAll.slice(0, 4).map(h =>
    `<i style="width:${Math.max(4, Math.round((h.tokens || 0) / hsTot * 100))}%;background:${colorFor(h.harness || "-")}" title="${esc(h.harness)}: ${compact(h.tokens)}"></i>`
  ).join("");

  const hs = hsAll.slice(0, 2);
  document.getElementById("harness").innerHTML = hs.map(h =>
    `<span><i style="background:${colorFor(h.harness || "-")}"></i>${esc(h.harness || "-")} ${esc(compact(h.tokens))}</span>`
  ).join("");

  // U6：月度预算进度微条。数据与面板预算 chip 严格同源（/api/summary 的 month/budget）。
  const bUsd = (summary.budget || {}).monthly_usd;
  const mSpent = (summary.month || {}).cost || 0;
  const bBar = document.getElementById("budgetBar");
  if (bBar) {
    if (bUsd && bUsd > 0) {
      const pct = Math.min(100, Math.round(mSpent / bUsd * 100));
      bBar.hidden = false;
      bBar.className = "budget-bar" + (mSpent >= bUsd ? " err" : mSpent >= bUsd * 0.8 ? " warn" : "");
      bBar.title = `本月预算：$${mSpent.toFixed(2)} / $${bUsd}（${(mSpent / bUsd * 100).toFixed(1)}%）`;
      document.getElementById("budgetFill").style.width = pct + "%";
    } else {
      bBar.hidden = true;
    }
  }

  // 状态点三级：超支红 > 未定价黄 > 正常绿（超支比缺价格更要紧，优先占住红）
  const unpriced = all.unpriced || 0;
  const overBudget = bUsd && bUsd > 0 && mSpent >= bUsd;
  const dot = document.getElementById("dot");
  dot.className = "dot" + (overBudget ? " err" : unpriced > 0 ? " warn" : "");
  document.getElementById("status").textContent = overBudget
    ? `本月已超支 ${money(mSpent - bUsd)}`
    : unpriced > 0 ? `${fmt(unpriced)} 条未定价` : "数据正常";

  const now = new Date();
  document.getElementById("clock").textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  document.title = `Token · ${compact(tk(today))}`;
  applyMenuState();
}

function setStatus(text, kind) {
  const dot = document.getElementById("dot");
  dot.className = "dot" + (kind ? " " + kind : "");
  document.getElementById("status").textContent = text;
}

/* ---------- 取数 ---------- */
async function refresh(silent) {
  const btn = document.getElementById("btnRefresh");
  if (!silent) {
    btn.disabled = true;
    btn.classList.add("spin");
  }
  try {
    const [summary, daily, meta] = await Promise.all([
      jget("/api/summary"),
      jget("/api/daily?dim=total&since=" + daysAgo(6)),
      jget("/api/meta"),
    ]);
    state.data = { summary, daily, meta };
    render(summary, daily, meta);
  } catch (e) {
    setStatus("连不上服务", "err");
  } finally {
    if (!silent) {
      btn.disabled = false;
      btn.classList.remove("spin");
    }
  }
}

function startPolling() {
  stopPolling();
  state.timer = setInterval(() => refresh(true), POLL_MS);
}
function stopPolling() {
  if (state.timer) clearInterval(state.timer);
  state.timer = null;
}

/* ---------- 桥调用（在浏览器里打开 widget.html 时 pywebview 不存在，要兜底） ---------- */
const hasBridge = () => window.pywebview && window.pywebview.api;
const call = async (name, ...args) => {
  if (!hasBridge()) return null;
  return window.pywebview.api[name](...args);
};

/* ---------- C7：右键菜单的勾选状态 ----------
 * 以前点完「置顶」只有 toast，菜单里看不出当前状态；自启同理。
 * 每次打开菜单前按真实状态重绘勾选标记（✓ / ⇧）。 */
function applyMenuState() {
  const topBtn = document.querySelector('#menu button[data-act="top"]');
  const autoBtn = document.querySelector('#menu button[data-act="autostart"]');
  if (topBtn) topBtn.textContent = (state.top ? "✓" : "⇧") + " 置顶";
  if (autoBtn) autoBtn.textContent = (state.autostart ? "✓" : "⇧") + " 开机自启";
}

async function syncState(showNotice) {
  const st = await call("get_state");
  if (st && typeof st === "object") {
    state.top = !!st.on_top;
    state.autostart = !!st.autostart;
    // 首启默认开启自启时后端会带一条 notice：只在启动时 toast 一次（showNotice），
    // 右键菜单每次打开都会调 syncState，不能每点一次右键就重复弹一遍。
    if (showNotice && st.notice) toast(st.notice);
  }
  applyMenuState();
}

/* ---------- 交互 ---------- */
function bind() {
  const tb = document.getElementById("titlebar");

  // 拖动：用 pywebview 官方 easy_drag 的同款算法（screenX - clientX → window.move），
  // 不再用 WM_NCLBUTTONDOWN 伪装系统拖动——js_api 在工作线程执行，跨线程
  // SendMessage 的按键状态不对，系统移动循环会直接退出（就是之前拖不动的原因）。
  tb.addEventListener("mousedown", e => {
    if (e.button !== 0 || e.target.closest("button")) return;
    const drag = { cx: e.clientX, cy: e.clientY, last: 0 };
    const onMove = ev => {
      const now = performance.now();
      if (now - drag.last < 16) return;   // 节流，避免桥调用排队
      drag.last = now;
      call("move_to", ev.screenX - drag.cx, ev.screenY - drag.cy);
    };
    const onUp = () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      call("save_position");
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });
  tb.addEventListener("dblclick", e => {
    if (e.target.closest("button")) return;
    call("open_panel");
  });

  document.getElementById("btnRefresh").onclick = () => refresh(false);
  document.getElementById("btnPanel").onclick = () => call("open_panel");
  document.getElementById("btnClose").onclick = () => call("quit");

  // C8：点迷你柱 → 面板按那天筛选
  document.getElementById("spark").addEventListener("click", e => {
    const bar = e.target.closest(".bar[data-date]");
    if (!bar) return;
    call("open_panel", bar.dataset.date, bar.dataset.date);
  });

  // 右键自定义菜单（禁用默认菜单）
  const menu = document.getElementById("menu");
  document.addEventListener("contextmenu", e => {
    e.preventDefault();
    // A9：打开菜单前重新问后端要状态，别用缓存——用户可能手动删了自启快捷方式，
    // 或另一个实例改了置顶；只 applyMenuState() 会把过期的 ✓ 画出来。
    syncState();
    menu.classList.add("show");
    const pad = 6;
    let x = e.clientX, y = e.clientY;
    if (x + menu.offsetWidth + pad > innerWidth) x = innerWidth - menu.offsetWidth - pad;
    if (y + menu.offsetHeight + pad > innerHeight) y = innerHeight - menu.offsetHeight - pad;
    menu.style.left = Math.max(pad, x) + "px";
    menu.style.top = Math.max(pad, y) + "px";
  });
  document.addEventListener("click", e => {
    if (!e.target.closest("#menu")) menu.classList.remove("show");
  });
  menu.addEventListener("click", e => {
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    menu.classList.remove("show");
    const act = b.dataset.act;
    if (act === "refresh") refresh(false);
    else if (act === "panel") call("open_panel");
    else if (act === "top") {
      // 先本地翻转，桥返回真实值再校正
      state.top = !state.top;
      call("set_topmost", state.top).then(v => {
        if (typeof v === "boolean") state.top = v;
        applyMenuState();
        toast(state.top ? "已置顶" : "已取消置顶");
      });
    } else if (act === "autostart") {
      const want = !state.autostart;
      call("set_autostart", want).then(v => {
        state.autostart = typeof v === "boolean" ? v : want;
        applyMenuState();
        toast(state.autostart ? "已开启开机自启" : "已关闭开机自启");
      });
    } else if (act === "theme") {
      // U6：浮窗内切换主题。写 localStorage["td-theme"] 让面板也同步
      // （同源共享 localStorage，面板监听 storage 事件实时跟随）。
      const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      localStorage.setItem("td-theme", next);
      document.documentElement.dataset.theme = next;
      toast(next === "light" ? "已切换到浅色主题" : "已切换到深色主题");
    } else if (act === "quit") call("quit");
  });

  // U6：面板切换主题时浮窗实时跟随（storage 事件只在「其他」窗口触发，
  // 自己写入不会重复响应；key 必须匹配，且只认合法值）。
  window.addEventListener("storage", e => {
    if (e.key === "td-theme" && (e.newValue === "light" || e.newValue === "dark")) {
      document.documentElement.dataset.theme = e.newValue;
    }
  });

  // A9：Esc 二次确认（无边框小窗里 Esc 是高频误按键，一按就没进程了）
  let escArmed = false, escTimer = null;
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (escArmed) {
        clearTimeout(escTimer);
        escArmed = false;
        call("quit");
        return;
      }
      escArmed = true;
      toast("再按一次 Esc 退出");
      escTimer = setTimeout(() => { escArmed = false; }, 2000);
    }
    if (e.key === "r" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); refresh(false); }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopPolling();
    else { refresh(true); startPolling(); }
  });
}

/* ---------- 启动 ---------- */
bind();
applyMenuState();
syncState(true);
refresh(true);
startPolling();
// 每 30s 顺手更新一次时钟（即使没拉到新数据）
setInterval(() => {
  const now = new Date();
  document.getElementById("clock").textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
}, 20000);
</script>
</body>
